[application]

[web.app]

# HTML title tag content
title = "drum-beat"

# include `assets` in web platform
[web.resource]

# Additional CSS style files
style = []

# Additional JavaScript files
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []

[bundle]
identifier = "com.xapphire13.drumbeat"
publisher = "Xapphire13"
# Generated from assets/icon.svg by scripts/build-icon.sh
icon = ["assets/icon.png"]

# Keeps the drums and click playing with the screen locked, and lets iOS
# create the virtual MIDI port
[background]
audio = true

# Shows DrumBeat's own folder in the Files app, so scores can be dropped in
[ios.plist]
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
