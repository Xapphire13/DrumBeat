[package]
name = "drum-beat"
version = "0.1.0"
authors = ["Xapphire13 <3392349+Xapphire13@users.noreply.github.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cpal = "0.18.2"
dioxus = { version = "0.7.9", features = [] }
dioxus-desktop = "0.7.9"
dirs = "7.0.0"
lucide-dioxus = { version = "3.58.0", features = ["arrows", "files", "layout", "math", "multimedia", "transportation"] }
midir = "0.11"
quick-xml = { version = "0.37", features = ["serialize"] }
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time"] }
toml_edit = { version = "0.25.17", features = ["serde"] }
trackpad_haptic = "0.1.1"
zip = { version = "2.6", default-features = false, features = ["deflate"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
