[package]
name = "drum-beat"
version = "0.1.0"
authors = ["Xapphire13 <3392349+Xapphire13@users.noreply.github.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cpal = "0.18.2"
dioxus = { version = "0.7.9", features = [] }
dioxus-desktop = "0.7.9"
dirs = "7.0.0"
lucide-dioxus = { version = "3.58.0", features = ["account", "arrows", "connectivity", "files", "layout", "math", "multimedia", "transportation"] }
midir = "0.11"
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time"] }
toml_edit = { version = "0.25.17", features = ["serde"] }
zip = { version = "2.6", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
rfd = { version = "0.17", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
trackpad_haptic = "0.1.1"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3", features = ["block2", "UIApplication", "UIColor", "UIDocumentPickerViewController", "UIGeometry", "UIResponder", "UIView", "UIViewController", "UIWindow"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
