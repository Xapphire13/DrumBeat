[package]
name = "drum-beat"
version = "0.1.0"
authors = ["Xapphire13 <3392349+Xapphire13@users.noreply.github.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.3", features = [] }
dioxus-desktop = "0.6.3"
dioxus-feather-icons = "0.2.3"
midir = "0.10.1"
trackpad_haptic = "0.1.1"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
